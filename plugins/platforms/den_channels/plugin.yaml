name: den-channels-platform
label: Den Channels
kind: platform
version: 0.1.0
description: >
  Native Den platform adapter for durable Hermes sessions. Claims Delivery
  successor intents, registers Runtime liveness, emits Observation activity, and
  posts visible replies through the Conversation successor. Legacy den-channels
  readback/subscription/control compatibility routes are retired for production.
author: Hermes Agent contributors
requires_env: []
optional_env:
  - name: DEN_CHANNELS_URL
    description: >
      Retired legacy den-channels base. Production Hermes profiles should leave
      this unset; configure DEN_CONVERSATION_URL, DEN_DELIVERY_URL,
      DEN_RUNTIME_URL, and DEN_OBSERVATION_URL instead. This variable is kept
      only so old profiles fail closed with an explicit migration hint rather
      than silently using the retired service.
    prompt: "Retired Den Channels URL (leave unset)"
    password: false
  - name: DEN_GATEWAY_URL
    description: >
      Gateway/delivery API base for executable actuation. Used for legacy gateway
      binding compatibility and, when DEN_DELIVERY_URL is omitted, delivery
      claim/complete/fail. Must have a bearer token configured via
      DEN_GATEWAY_TOKEN or a service-specific successor token.
    prompt: "Den Gateway/delivery URL"
    password: false
  - name: DEN_DELIVERY_URL
    description: >
      Delivery successor API base. When both DEN_GATEWAY_URL and
      DEN_DELIVERY_URL are set, DEN_DELIVERY_URL takes precedence for delivery
      claim, complete/fail, and delivery-intent events.
    prompt: "Den delivery API URL"
    password: false
  - name: DEN_RUNTIME_URL
    description: >
      Runtime successor API base used to register and heartbeat this Hermes
      adapter instance before claiming Delivery-successor intents. Usually this
      should be the sanctioned Gateway route that forwards /v1/runtime/* with
      server-side upstream auth, not the Runtime service loopback port directly.
      If omitted, the adapter tries DEN_GATEWAY_RUNTIME_URL, then DEN_GATEWAY_URL,
      then DEN_DELIVERY_URL. Delivery claims stay disabled until registration
      succeeds.
    prompt: "Den Runtime API URL"
    password: false
  - name: DEN_RUNTIME_TOKEN
    description: >
      Bearer token for the Runtime successor caller route. If omitted, the
      adapter tries DEN_GATEWAY_RUNTIME_TOKEN and then existing gateway/channels
      tokens. Missing or rejected Runtime auth disables Delivery claims rather
      than bypassing liveness.
    prompt: "Den Runtime token"
    password: true
  - name: DEN_OBSERVATION_URL
    description: >
      Den observation/activity API base. Used for: tool-activity event emission
      (breadcrumbs), agent status/progress projection. If not set, observation
      telemetry is skipped/fail-soft; it must not fall back to Den Channels.
    prompt: "Den observation URL"
    password: false
  - name: DEN_OBSERVATION_TOKEN
    description: >
      Bearer token for the observation/activity API. When set, overrides
      DEN_CHANNELS_TOKEN for observation writes. Required when observation
      is served through the Gateway with a separate write-auth token
      (DEN_GATEWAY_OBSERVATION_WRITE_TOKEN). Falls back to DEN_CHANNELS_TOKEN
      when not set.
    prompt: "Den observation token"
    password: true
  - name: DEN_CONVERSATION_URL
    description: >
      Gateway/conversation successor URL for channel-message writes. When
      set and DEN_CONVERSATION_ENABLED=true, channel_message replies are
      posted through the Gateway conversation successor (POST /v1/conversation/
      channels/{id}/messages) instead of the legacy channels API. Requires
      DEN_CONVERSATION_TOKEN for Gateway auth. There is no legacy write
      fallback; missing or failing successor config makes reply posting fail
      closed so den-channels legacy channel-message writes can be tombstoned.
    prompt: "Den conversation successor URL"
    password: false
  - name: DEN_CONVERSATION_TOKEN
    description: >
      Bearer token for the Gateway conversation successor write path.
      Used with DEN_CONVERSATION_URL. Do not share this token — it has
      conversation write authority.
    prompt: "Den conversation token"
    password: true
  - name: DEN_CONVERSATION_READ_TOKEN
    description: >
      Bearer token for Gateway conversation successor readback. Used to read
      Den Web-created conversation messages for Delivery-successor wake bodies.
      If omitted, DEN_CONVERSATION_TOKEN is used; active Gateway configs may
      require a separate read token.
    prompt: "Den conversation read token"
    password: true
  - name: DEN_CONVERSATION_ENABLED
    description: >
      Set to "true" to enable the conversation successor write path for
      channel-message replies. Active Den Channels Hermes profiles must set
      this to "true"; "false" is readback/poll-only and reply posting fails
      closed rather than using legacy channel-message writes.
    prompt: "Enable conversation successor? (true/false)"
    password: false
  - name: DEN_GATEWAY_TOKEN
    description: >
      Bearer token for the gateway/delivery API base. Required when the gateway
      or delivery service is not on a private LAN address trusted by default.
    prompt: "Den Gateway/delivery token"
    password: true
  - name: DEN_CHANNELS_TOKEN
    description: >
      Bearer token for Den Channels conversation API. Required when the channels
      retired den-channels service is not on a private LAN address. Do not use for production successor operation. Also used as
      fallback for the gateway/delivery API if DEN_GATEWAY_TOKEN is not set.
    prompt: "Den Channels token"
    password: true
  - name: DEN_CHANNELS_PROJECT_ID
    description: >
      Optional default project scope for claimed Den Channels deliveries.
    prompt: "Den Channels project id"
    password: false
  - name: DEN_CHANNELS_ADAPTER_INSTANCE_ID
    description: >
      Stable adapter instance id; defaults to host:profile:role:gateway.
    prompt: "Adapter instance id"
    password: false
  - name: DEN_CHANNELS_ALLOWED_USERS
    description: >
      Comma-separated Den identities allowed for non-internal messages.
    prompt: "Allowed Den users"
    password: false
  - name: DEN_CHANNELS_ALLOW_ALL_USERS
    description: >
      Allow all Den users for non-internal messages.
    prompt: "Allow all Den users? (true/false)"
    password: false
